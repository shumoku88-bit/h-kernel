name: GHCup Home Experiment

on:
  push:
    branches:
      - experiment/ghcup-style-home
    paths:
      - experiments/ghcup-home/**
      - .github/workflows/ghcup-home-experiment.yml
  pull_request:
    paths:
      - experiments/ghcup-home/**
      - .github/workflows/ghcup-home-experiment.yml

permissions:
  contents: read

concurrency:
  group: ghcup-home-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: 9.14.1
          cabal-version: latest

      - name: Build experiment
        run: |
          cabal build \
            --project-file=experiments/ghcup-home/cabal.project \
            h-kernel-ghcup-home \
            --disable-optimization
