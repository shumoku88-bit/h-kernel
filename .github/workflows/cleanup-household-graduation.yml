name: Cleanup Household Graduation Map

on:
  push:
    branches:
      - refactor/graduate-household-report-spike

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Align current documentation and formatting
        run: python3 tools/household_graduation_cleanup.py

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm tools/household_graduation_cleanup.py
          rm .github/workflows/cleanup-household-graduation.yml
          echo '=== stale current spike map references ==='
          grep -R -n -E 'h-kernel-spike-|source: spike-src/|`spike-src/` \|' README.md docs h-kernel.cabal || true
          git config user.name 'shumoku88-bit'
          git config user.email 'shumoku88@gmail.com'
          git add -A
          git commit -m 'docs: align household report ownership map'
          git push origin HEAD:refactor/graduate-household-report-spike
