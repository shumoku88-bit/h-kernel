name: Weeder Observation

on:
  push:
    branches:
      - obs/weeder-experiment-001

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.4"
          cabal-version: latest

      - name: Install Weeder 2.10.0
        shell: bash
        run: |
          set -euo pipefail
          cabal update
          mkdir -p "$HOME/.local/bin"
          cabal install weeder-2.10.0 \
            --install-method=copy \
            --installdir="$HOME/.local/bin" \
            --overwrite-policy=always
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build all components with HIE information
        shell: bash
        run: |
          set -euo pipefail
          cabal clean
          cabal build all --ghc-options=-fwrite-ide-info

      - name: Observe strict and public-surface reachability
        shell: bash
        run: |
          set -euo pipefail
          weeder --version

          python3 - <<'PY'
          from pathlib import Path
          import re

          cabal = Path("h-kernel.cabal").read_text().splitlines()
          exposed = []
          collecting = False
          for line in cabal:
              start = re.match(r"^\s*exposed-modules:\s*([A-Za-z0-9_.]+)\s*$", line)
              if start:
                  exposed.append(start.group(1))
                  collecting = True
                  continue
              if collecting:
                  continuation = re.match(r"^\s*,\s*([A-Za-z0-9_.]+)\s*$", line)
                  if continuation:
                      exposed.append(continuation.group(1))
                      continue
                  collecting = False

          exposed = sorted(set(exposed))
          print(f"Cabal exposed modules retained in second pass: {len(exposed)}")
          for module in exposed:
              print(f"  {module}")

          strict = "\n".join([
              "roots = [ '.*\\.main$', '^Paths_.*' ]",
              "type-class-roots = true",
              "root-instances = []",
              "root-modules = []",
              "unused-types = false",
              "",
          ])
          Path("/tmp/weeder-strict.toml").write_text(strict)

          module_patterns = ["'^" + re.escape(module) + "$'" for module in exposed]
          public = "\n".join([
              "roots = [ '.*\\.main$', '^Paths_.*' ]",
              "type-class-roots = true",
              "root-instances = []",
              "root-modules = [",
              *[f"  {pattern}," for pattern in module_patterns],
              "]",
              "unused-types = false",
              "",
          ])
          Path("/tmp/weeder-public.toml").write_text(public)
          PY

          run_weeder() {
            config="$1"
            output="$2"
            cp "$config" weeder.toml
            set +e
            weeder --no-default-fields > "$output" 2>&1
            status=$?
            set -e
            printf '%s\n' "$status" > "$output.status"
            case "$status" in
              0|228) ;;
              *)
                echo "Weeder failed unexpectedly with status $status"
                cat "$output"
                exit "$status"
                ;;
            esac
          }

          run_weeder /tmp/weeder-strict.toml /tmp/weeder-strict.txt
          run_weeder /tmp/weeder-public.toml /tmp/weeder-public.txt

          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          weed_line = re.compile(r"^([^:]+):(\d+):\s*(.+)$")

          def read_weeds(path):
              rows = []
              for raw in Path(path).read_text().splitlines():
                  match = weed_line.match(raw.strip())
                  if match:
                      rows.append((match.group(1), int(match.group(2)), match.group(3)))
              return rows

          strict_rows = read_weeds("/tmp/weeder-strict.txt")
          public_rows = read_weeds("/tmp/weeder-public.txt")
          strict = set(strict_rows)
          public = set(public_rows)
          public_only = sorted(strict - public)

          def top(path):
              clean = path[2:] if path.startswith("./") else path
              return clean.split("/", 1)[0]

          print("\n=== WEEDER OBSERVATION SUMMARY ===")
          print(f"strict-root weeds: {len(strict)}")
          print(f"public-surface-retained weeds: {len(public)}")
          print(f"strict-only findings removed by retaining exposed modules: {len(public_only)}")

          print("\nPublic-retained weeds by top-level source tree:")
          for tree, count in Counter(top(path) for path, _, _ in public).most_common():
              print(f"  {tree}: {count}")

          print("\nStrict-only findings by top-level source tree:")
          for tree, count in Counter(top(path) for path, _, _ in public_only).most_common():
              print(f"  {tree}: {count}")

          print("\n=== PUBLIC-SURFACE-RETAINED WEEDS ===")
          for path, line, symbol in sorted(public):
              print(f"{path}:{line}: {symbol}")

          print("\n=== STRICT-ONLY / PUBLIC-SURFACE-SENSITIVE FINDINGS ===")
          for path, line, symbol in public_only:
              print(f"{path}:{line}: {symbol}")
          PY

          echo "strict Weeder exit status: $(cat /tmp/weeder-strict.txt.status)"
          echo "public-retained Weeder exit status: $(cat /tmp/weeder-public.txt.status)"

          rm -f weeder.toml
