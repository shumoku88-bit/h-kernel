name: Public Module Surface Observation

on:
  push:
    branches:
      - obs/public-module-surface-001

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Observe Cabal public module surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          cabal = Path('h-kernel.cabal').read_text()

          library_source_dirs = {
              'h-kernel': 'src',
              'h-kernel-household': 'household-src',
              'h-kernel-editor': 'editor-src',
              'h-kernel-spike-household-report': 'spike-src',
          }

          # Extract exposed modules from the four library stanzas. The current
          # Cabal file uses a first item on the field line followed by comma-led
          # continuation lines.
          exposed_by_component: dict[str, list[str]] = {}
          lines = cabal.splitlines()
          current_component = None
          collecting = False

          for line in lines:
              if line and not line[0].isspace():
                  m = re.fullmatch(r'library(?:\s+(.+))?', line.strip())
                  if m:
                      current_component = m.group(1) or 'h-kernel'
                      collecting = False
                      exposed_by_component.setdefault(current_component, [])
                      continue
                  if re.match(r'(executable|test-suite|benchmark|common|flag|source-repository)\b', line):
                      current_component = None
                      collecting = False

              if current_component is None:
                  continue

              field = re.match(r'\s*exposed-modules:\s*(.*)$', line)
              if field:
                  collecting = True
                  payload = field.group(1)
              elif collecting and re.match(r'\s*,\s*HKernel\.', line):
                  payload = re.sub(r'^\s*,\s*', '', line)
              else:
                  if collecting and line.strip() and not re.match(r'\s*,', line):
                      collecting = False
                  continue

              for module in re.findall(r'HKernel(?:\.[A-Za-z][A-Za-z0-9_]*)+', payload):
                  exposed_by_component[current_component].append(module)

          exposed_to_component = {
              module: component
              for component, modules in exposed_by_component.items()
              for module in modules
          }
          exposed = set(exposed_to_component)

          roots = [
              'src', 'household-src', 'editor-src', 'spike-src',
              'app', 'editor-app', 'editor-tui-app', 'tests', 'tools'
          ]

          module_path: dict[str, Path] = {}
          imports_by_module: dict[str, set[str]] = {}
          explicit_exports: dict[str, bool] = {}
          loc: dict[str, int] = {}
          path_module: dict[Path, str] = {}

          module_decl = re.compile(r'^\s*module\s+([A-Z][A-Za-z0-9_.\']*)', re.M)
          import_decl = re.compile(
              r'^\s*import\s+(?:qualified\s+)?(?:"[^"]+"\s+)?([A-Z][A-Za-z0-9_.\']*)',
              re.M,
          )

          for root in roots:
              p = Path(root)
              if not p.exists():
                  continue
              for hs in p.rglob('*.hs'):
                  text = hs.read_text(errors='replace')
                  m = module_decl.search(text)
                  if not m:
                      # Main modules are relevant as importers even without an
                      # explicit module declaration.
                      name = f'<main:{hs}>'
                  else:
                      name = m.group(1)
                      module_path[name] = hs
                  path_module[hs] = name
                  imports_by_module[name] = set(import_decl.findall(text))
                  loc[name] = len(text.splitlines())

                  if m:
                      where_pos = text.find('where', m.end())
                      between = text[m.end():where_pos] if where_pos != -1 else ''
                      explicit_exports[name] = '(' in between

          importers: dict[str, list[tuple[str, Path]]] = defaultdict(list)
          for importer, imports in imports_by_module.items():
              importer_path = module_path.get(importer)
              if importer_path is None and importer.startswith('<main:'):
                  importer_path = Path(importer[len('<main:'):-1])
              if importer_path is None:
                  continue
              for imported in imports:
                  importers[imported].append((importer, importer_path))

          def category(path: Path) -> str:
              s = path.as_posix()
              if s.startswith(('src/', 'household-src/', 'editor-src/', 'spike-src/')):
                  return 'library'
              if s.startswith(('app/', 'editor-app/', 'editor-tui-app/')):
                  return 'delivery'
              if s.startswith('tests/'):
                  return 'test'
              if s.startswith('tools/'):
                  return 'tool'
              return 'other'

          print('=== PUBLIC MODULE SURFACE SUMMARY ===')
          print(f'exposed modules total: {len(exposed)}')
          for component in library_source_dirs:
              modules = exposed_by_component.get(component, [])
              print(f'{component}: {len(modules)}')

          missing_source = sorted(module for module in exposed if module not in module_path)
          print(f'exposed modules without located source: {len(missing_source)}')
          for module in missing_source:
              print(f'  MISSING {module}')

          export_counter = Counter(explicit_exports.get(module, False) for module in exposed)
          print(f'explicit export list: {export_counter[True]}')
          print(f'implicit export-all: {export_counter[False]}')

          only_internal_public = []
          no_delivery_or_test = []
          zero_importers = []
          imported_only_by_tests = []

          print('=== PER-MODULE SURFACE ===')
          print('component\tmodule\tloc\texplicit_exports\tpublic_importers\tlibrary_importers\tdelivery_importers\ttest_importers\ttool_importers')
          for module in sorted(exposed):
              counts = Counter(category(path) for _, path in importers.get(module, []))
              public_importers = sum(1 for importer, _ in importers.get(module, []) if importer in exposed)
              total = sum(counts.values())
              print(
                  f'{exposed_to_component[module]}\t{module}\t{loc.get(module, 0)}\t'
                  f'{explicit_exports.get(module, False)}\t{public_importers}\t'
                  f'{counts["library"]}\t{counts["delivery"]}\t{counts["test"]}\t{counts["tool"]}'
              )

              if total == 0:
                  zero_importers.append(module)
              if counts['test'] > 0 and counts['library'] == 0 and counts['delivery'] == 0 and counts['tool'] == 0:
                  imported_only_by_tests.append(module)
              if counts['delivery'] == 0 and counts['test'] == 0 and counts['tool'] == 0:
                  no_delivery_or_test.append(module)
              if public_importers > 0 and counts['delivery'] == 0 and counts['test'] == 0 and counts['tool'] == 0:
                  only_internal_public.append(module)

          print('=== SHAPE SIGNALS ===')
          print(f'zero in-repository importers: {len(zero_importers)}')
          for module in zero_importers:
              print(f'  ZERO {module}')
          print(f'imported only by tests: {len(imported_only_by_tests)}')
          for module in imported_only_by_tests:
              print(f'  TEST_ONLY {module}')
          print(f'no delivery/test/tool importer: {len(no_delivery_or_test)}')
          for module in no_delivery_or_test:
              print(f'  LIB_ONLY {module}')
          print(f'only other exposed library modules import it: {len(only_internal_public)}')
          for module in only_internal_public:
              print(f'  PUBLIC_INTERNAL {module}')

          suffix_buckets = {
              'source/admission-shaped': re.compile(r'(\.Journal|\.TSV|\.Config)$|\.Loader$|\.CLI$'),
              'render/presentation-shaped': re.compile(r'(\.Render|\.Presentation|\.TerminalStyle)$'),
              'interaction/editor-shaped': re.compile(r'^HKernel\.Editor\.'),
              'spike-shaped': re.compile(r'^HKernel\.Spike\.'),
          }
          print('=== NAME-SHAPE BUCKETS (HEURISTIC, NOT A DECISION) ===')
          for label, pattern in suffix_buckets.items():
              modules = sorted(module for module in exposed if pattern.search(module))
              print(f'{label}: {len(modules)}')
              for module in modules:
                  print(f'  {module}')
          PY
