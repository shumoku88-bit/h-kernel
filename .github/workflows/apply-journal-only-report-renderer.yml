name: Apply Journal-only Renderer Subtraction

on:
  push:
    branches:
      - refactor/journal-only-report-renderer

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply focused subtraction
        run: python3 tools/apply_journal_only_report_renderer.py
      - name: Commit focused subtraction
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_journal_only_report_renderer.py
          rm .github/workflows/apply-journal-only-report-renderer.yml
          git config user.name 'shumoku88-bit'
          git config user.email 'shumoku88@gmail.com'
          git add -A
          git commit -m 'refactor(report): keep ReportBook journal-only'
          git push origin HEAD:refactor/journal-only-report-renderer
