name: Restore Plan Budget Sync Picker

on:
  push:
    branches:
      - refactor/tui-report-owner

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore Plan-owned modal view
        run: python3 tools/restore_plan_budget_sync_picker.py
      - name: Commit focused restore
        shell: bash
        run: |
          set -euo pipefail
          rm tools/restore_plan_budget_sync_picker.py
          rm .github/workflows/restore-plan-budget-sync-picker.yml
          git config user.name 'shumoku88-bit'
          git config user.email 'shumoku88@gmail.com'
          git add -A
          git commit -m 'fix(tui): keep Plan Budget sync picker in shell'
          git push origin HEAD:refactor/tui-report-owner
