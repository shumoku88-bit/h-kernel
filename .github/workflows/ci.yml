name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc:
          - "9.10.3"
          - "9.12.4"
          - "9.14.1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest

      - name: Check report scripts
        run: |
          sh -n report report-build report-benchmark report-verify report-snapshot report-real-snapshot tools/hk
          python3 -m py_compile tools/report_sections.py tools/verify_report_corpus.py tools/verify_daily_command_hub.py tools/verify_household_report_config_resolution.py
          python3 tools/verify_daily_command_hub.py

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test all

      - name: Audit repository ownership
        if: matrix.ghc == '9.10.3'
        run: cabal run exe:repository-audit

      - name: Verify complete report contracts
        if: matrix.ghc == '9.10.3'
        run: |
          mkdir -p .report-bin-ci
          cp "$(cabal list-bin exe:h-kernel)" .report-bin-ci/h-kernel
          chmod 755 .report-bin-ci/h-kernel
          test ! -e ledger-data
          .report-bin-ci/h-kernel all >/dev/null
          python3 tools/verify_household_report_config_resolution.py \
            .report-bin-ci/h-kernel \
            tests/fixtures/report-contract.journal \
            tests/fixtures/report-entrypoints.toml
          printf 'deliberately invalid local configuration\n' > report.toml
          export HKERNEL_REPORT_CONFIG="$PWD/report.toml"
          HKERNEL_REPORT_BIN_DIR="$PWD/.report-bin-ci" \
            REPORT_VERIFY_SKIP_BUILD=1 \
            sh ./report-verify --fixture
          HKERNEL_REPORT_BIN_DIR="$PWD/.report-bin-ci" \
            REPORT_VERIFY_SKIP_BUILD=1 \
            sh ./report-verify --corpus
          python3 tools/verify_report_entrypoints.py \
            .report-bin-ci/h-kernel \
            tests/fixtures/report-contract.journal \
            tests/fixtures/report-entrypoints.toml
          python3 tools/verify_report_entrypoints.py \
            .report-bin-ci/h-kernel \
            tests/corpus/synthetic-v1/synthetic.journal \
            tests/fixtures/report-entrypoints.toml
