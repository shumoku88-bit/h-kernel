name: Apply TUI Report Owner Extraction

on:
  push:
    branches:
      - refactor/tui-report-owner

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply focused Report extraction
        run: python3 tools/apply_tui_report_owner.py
      - name: Commit focused extraction
        shell: bash
        run: |
          set -euo pipefail
          rm tools/apply_tui_report_owner.py
          rm .github/workflows/apply-tui-report-owner.yml
          git config user.name 'shumoku88-bit'
          git config user.email 'shumoku88@gmail.com'
          git add -A
          git commit -m 'refactor(tui): give Reports a named owner'
          git push origin HEAD:refactor/tui-report-owner
